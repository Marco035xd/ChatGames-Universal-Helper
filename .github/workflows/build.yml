name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and test
        run: ./gradlew --no-daemon build
      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: chatgames-universal-helper
          path: build/libs/*.jar
          if-no-files-found: error
